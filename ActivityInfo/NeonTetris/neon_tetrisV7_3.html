<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON TETRIS - BATTLE EDITION</title>
<style>
:root{--bg:#070b1d;--cyan:#35f5ff;--pink:#ff39dc;--purple:#9d4dff;--text:#eafcff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 10%,#18205a 0,#080c22 48%,#03050d 100%);color:var(--text);font-family:system-ui,"Yu Gothic",sans-serif;display:flex;justify-content:center;align-items:center;padding:8px}
.app{width:min(100%,1000px);padding:10px;border:1px solid #2c78ff;border-radius:18px;background:#070b1ddd;box-shadow:0 0 24px #125bff55,inset 0 0 25px #26105a66;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
h1{font-size:clamp(16px,3.5vw,26px);margin:0;letter-spacing:2px;color:#fff;text-shadow:0 0 7px var(--cyan),0 0 20px var(--purple)}
.sub{font-size:10px;color:#9cb9ef}

.setting-group{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;align-items:center;background:#0b1432;padding:6px 10px;border-radius:10px;border:1px solid #1f3e82} .setting-row{display:flex;gap:4px;align-items:center;font-size:11px;color:#7fb9ff;font-weight:700} .mode-btn,.diff-btn{padding:4px 8px;font-size:11px;background:#111e49;border:1px solid #3b8dff;border-radius:6px;color:#efffff;cursor:pointer} .mode-btn.active,.diff-btn.active{background:linear-gradient(120deg,#4724b5,#ff39dc);border-color:#d67bff;box-shadow:0 0 10px #a22cffaa}
.boards-container{display:flex;gap:8px;justify-content:center;align-items:flex-start;width:100%;margin-bottom:6px;overflow-x:auto;padding:6px 2px} .player-box{border:1px solid #245dca;border-radius:12px;padding:6px;background:#09112b;box-shadow:inset 0 0 12px #163b8355;flex-shrink:0;position:relative;transition:transform .1s, border-color .2s} .player-box.self{border-color:var(--cyan);box-shadow:0 0 20px #35f5ff66,inset 0 0 15px #163b8366} .player-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;font-size:10px;font-weight:700;color:#7fb9ff} .player-header .p-name{color:var(--cyan);text-shadow:0 0 6px var(--cyan)} .player-stats{display:flex;justify-content:space-between;font-size:9px;margin-bottom:4px;color:#bcd8ff}
.mini-stage{display:flex;gap:5px;align-items:flex-start;justify-content:center} .board-wrap{position:relative;border:2px solid #2c78ff;border-radius:6px;box-shadow:0 0 10px #2c78ff;overflow:hidden;flex-shrink:0;background:#030612} .board-wrap.self-wrap{border-color:var(--cyan);box-shadow:0 0 16px var(--cyan),0 0 30px #9d4dff55} canvas.board{display:block;background:#030612}
.mini-side{display:flex;flex-direction:column;gap:5px;font-size:9px;flex-shrink:0} .mini-panel{border:1px solid #345ce5;border-radius:6px;background:#0a122e;padding:3px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 6px #1b3db344} .mini-panel label{display:block;font-size:8px;color:#80dfff;margin-bottom:2px;font-weight:800;letter-spacing:1px} canvas.slot-mini{display:block;background:#030612;border-radius:4px;border:1px solid #1a2a5a}
button{color:#efffff;background:#111e49;border:1px solid #3b8dff;border-radius:8px;padding:6px 10px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 0 9px #164bff44;transition:transform .08s,box-shadow .15s} button:hover{box-shadow:0 0 15px var(--cyan)}button:active{transform:scale(.95)} .primary{background:linear-gradient(120deg,#4724b5,#ff39dc);border-color:#ff8ef5;box-shadow:0 0 15px #a22cffaa} .global-controls{display:flex;gap:8px;justify-content:center;margin-bottom:4px} .controls{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;max-width:500px;margin:0 auto} .controls button{padding:9px 2px;font-size:13px}.controls .wide{font-size:10px} .status{text-align:center;min-height:20px;margin:2px 0 0;color:#ffe86a;text-shadow:0 0 12px #ffad32,0 0 24px #ff39dc;font-weight:900;font-size:13px;letter-spacing:1px} .help{text-align:center;font-size:9px;color:#9db6e6;margin-top:2px;line-height:1.3}
#overlay{position:absolute;inset:0;background:#030617f6;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:10px;z-index:20} #overlay h2{color:white;text-shadow:0 0 10px var(--cyan),0 0 25px var(--pink),0 0 45px var(--purple);margin:0 0 6px;font-size:18px;letter-spacing:2px} #overlay p{font-size:10px;color:#bcd8ff;margin-bottom:8px}
@keyframes shakeHard{0%{transform:translate(0,0)}15%{transform:translate(-6px,6px) rotate(-1deg)}30%{transform:translate(6px,-5px) rotate(1deg)}45%{transform:translate(-5px,-4px)}60%{transform:translate(5px,5px)}75%{transform:translate(-3px,2px)}100%{transform:translate(0,0)}} @keyframes shakeSoft{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}100%{transform:translate(0,0)}} .shake-hard{animation:shakeHard .35s ease-in-out} .shake-soft{animation:shakeSoft .2s ease-in-out} </style>
</head>
<body>
<main class="app">
<header>
  <div><h1>NEON TETRIS</h1><div class="sub">1人プレイ ＆ 最大4人CPU対戦モード</div></div>
  <div style="display:flex;gap:6px;">
    <button id="pause" style="padding:4px 8px;font-size:11px;">Ⅱ 一時停止</button>
    <button id="soundBtn" style="padding:4px 8px;font-size:11px;">🔊 音ON</button>
  </div>
</header>

<div class="setting-group">
  <div class="setting-row">
    <span>人数:</span>
    <button class="mode-btn active" data-players="1">1人</button>
    <button class="mode-btn" data-players="2">2人</button>
    <button class="mode-btn" data-players="3">3人</button>
    <button class="mode-btn" data-players="4">4人</button>
  </div>
  <div class="setting-row">
    <span>CPUの強さ:</span>
    <button class="diff-btn" data-diff="easy">よわい</button>
    <button class="diff-btn" data-diff="normal">ふつう</button>
    <button class="diff-btn" data-diff="hard">つよい</button>
    <button class="diff-btn active" data-diff="expert">たつじん</button>
  </div>
</div>

<div id="boardsContainer" class="boards-container"></div>
<div id="status" class="status" aria-live="polite"></div>

<div class="global-controls">
  <button id="restartBtn">↻ リスタート</button>
</div>

<div class="controls">
 <button data-act="hold" class="wide" aria-label="ホールド">HOLD</button>
 <button data-act="left" aria-label="左">◀</button>
 <button data-act="rotate" aria-label="回転">↻</button>
 <button data-act="right" aria-label="右">▶</button>
 <button data-act="down" aria-label="下">▼</button>
 <button data-act="drop" class="primary wide" aria-label="一気に落下">⏬</button>
</div>
<div class="help">操作：← → 移動 ／ ↑ 回転 ／ ↓ 落下 ／ Space 一気に落下 ／ C or Shift ホールド ／ P 一時停止</div>
</main>

<script>
(()=>{
const W=10,H=20;
const TYPES=[
 {m:[[1,1,1,1]],c:'#30f5ff'},{m:[[1,1],[1,1]],c:'#ffe84d'},
 {m:[[0,1,0],[1,1,1]],c:'#c65cff'},{m:[[1,0,0],[1,1,1]],c:'#ff9b35'},
 {m:[[0,0,1],[1,1,1]],c:'#4b91ff'},{m:[[0,1,1],[1,1,0]],c:'#48ff8b'},
 {m:[[1,1,0],[0,1,1]],c:'#ff4e87'}
];


let numPlayers=1;
let cpuDifficulty='expert';
let players=[];
let running=false,paused=false,ended=false,raf=0,last=0,sound=true,audio=null;


function clone(m){return m.map(r=>r.slice())}
function pick(){let t=TYPES[Math.floor(Math.random()*TYPES.length)];return {m:clone(t.m),c:t.c,x:0,y:0}}


class TetrisGame {
  constructor(id, isCpu, name){
    this.id=id;
    this.isCpu=isCpu;
    this.name=name;
    this.grid=Array.from({length:H},()=>Array(W).fill(null));
    this.score=0;
    this.lines=0;
    this.level=1;
    this.piece=null;
    this.next=null;
    this.holdPiece=null;
    this.canHold=true;
    this.ended=false;
    this.acc=0;
    this.cpuTimer=0;
    this.particles=[];
    this.floats=[];
    this.waves=[];
    this.flash=0;
  }


  init(){
    this.grid=Array.from({length:H},()=>Array(W).fill(null));
    this.score=0;
    this.lines=0;
    this.level=1;
    this.holdPiece=null;
    this.canHold=true;
    this.ended=false;
    this.acc=0;
    this.cpuTimer=0;
    this.particles=[];
    this.floats=[];
    this.waves=[];
    this.flash=0;
    this.next=pick();
    this.spawn();
  }


  spawn(){
    this.piece=this.next||pick();
    this.next=pick();
    this.piece.x=Math.floor((W-this.piece.m[0].length)/2);
    this.piece.y=0;
    this.canHold=true;


    if(this.hit(this.piece,0,0,this.piece.m)){
      this.ended=true;
      triggerShake(this.id,'hard');
      checkGameOver();
    }
  }


  hit(p,dx,dy,m,grid=this.grid){
    for(let y=0;y<m.length;y++){
      for(let x=0;x<m[y].length;x++){
        if(m[y][x]){
          let xx=p.x+x+dx, yy=p.y+y+dy;
          if(xx<0||xx>=W||yy>=H)return true;
          if(yy>=0&&grid[yy][xx])return true;
        }
      }
    }
    return false;
  }


  doHold(){
    if(!this.canHold||this.ended)return;
    this.canHold=false;
    if(!this.holdPiece){
      this.holdPiece={m:clone(this.piece.m),c:this.piece.c};
      this.spawn();
    }else{
      let temp={m:clone(this.piece.m),c:this.piece.c};
      this.piece={m:clone(this.holdPiece.m),c:this.holdPiece.c,x:0,y:0};
      this.holdPiece=temp;
      this.piece.x=Math.floor((W-this.piece.m[0].length)/2);
      this.piece.y=0;
    }
    if(!this.isCpu) tone(480,.05,'sine',.03);
  }


  move(dx,dy){
    if(this.ended)return false;
    if(!this.hit(this.piece,dx,dy,this.piece.m)){
      this.piece.x+=dx;
      this.piece.y+=dy;
      if(dy===1&&!this.isCpu) tone(210,.02,'triangle',.01);
      return true;
    }
    if(dy===1)this.lock();
    return false;
  }


  rotate(){
    if(this.ended)return;
    let m=this.piece.m, rot=m[0].map((_,i)=>m.map(r=>r[i]).reverse());
    for(let k of [0,-1,1,-2,2]){
      if(!this.hit(this.piece,k,0,rot)){
        this.piece.x+=k;
        this.piece.m=rot;
        if(!this.isCpu) tone(540,.05,'square',.02);
        return;
      }
    }
  }


  drop(){
    if(this.ended)return;
    let n=0;
    while(!this.hit(this.piece,0,1,this.piece.m)){
      this.piece.y++;
      n++;
    }
    this.score+=n*2;
    this.addParticles(this.piece.x*15+15, this.piece.y*15+15, 6, '#ffffff');
    if(!this.isCpu) tone(140,.08,'sawtooth',.03);
    this.lock();
  }


  lock(){
    this.piece.m.forEach((r,y)=>r.forEach((v,x)=>{
      if(v&&this.piece.y+y>=0)this.grid[this.piece.y+y][this.piece.x+x]=this.piece.c;
    }));


    let rows=[];
    for(let y=0;y<H;y++)if(this.grid[y].every(Boolean))rows.push(y);


    if(rows.length){
      this.flash=1;
      let clearColor=this.piece.c;


      rows.forEach(ry=>{
        for(let i=0;i<12;i++){
          this.addParticles(Math.random()*150, ry*15+7.5, 1, clearColor);
        }
        this.waves.push({y:(ry+0.5)*15, r:0, maxR:60, color:clearColor});
      });


      this.grid=this.grid.filter((_,y)=>!rows.includes(y));
      while(this.grid.length<H)this.grid.unshift(Array(W).fill(null));
      
      let points=[0,100,300,500,800][rows.length]*this.level;
      this.score+=points;
      this.lines+=rows.length;
      this.level=1+Math.floor(this.lines/10);


      let msg=['','SINGLE!','DOUBLE!','TRIPLE!','TETRIS!'][rows.length]||'EXCELLENT!';
      this.addFloat(msg, 75, Math.max(30, rows[0]*15), clearColor);


      if(!this.isCpu){
        tone(620,.1,'triangle',.05);
        if(rows.length>=4) setTimeout(()=>tone(980,.2,'sine',.06),80);
      }


      if(rows.length>=2){
        sendGarbage(this.id, rows.length - 1);
      }
    }
    this.spawn();
    updateUIStats();
  }


  addGarbage(count){
    for(let i=0; i<count; i++){
      this.grid.shift();
      let garbageRow=Array(W).fill('#555577');
      let hole=Math.floor(Math.random()*W);
      garbageRow[hole]=null;
      this.grid.push(garbageRow);
    }
    this.addFloat(`+${count} GARBAGE!`, 75, 150, '#ff39dc');
    triggerShake(this.id, count>=2?'hard':'soft');
    if(this.piece&&this.hit(this.piece,0,0,this.piece.m)){
      this.ended=true;
      checkGameOver();
    }
  }


  addParticles(x,y,count,color){
    for(let i=0;i<count;i++){
      let a=Math.random()*Math.PI*2, v=1+Math.random()*3;
      this.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:20+Math.random()*15,color,size:2+Math.random()*2});
    }
  }


  addFloat(text,x,y,color){
    this.floats.push({text,x,y,color,life:45});
  }


  updateCpu(dt){
    if(!this.isCpu||this.ended)return;
    this.cpuTimer+=dt;
    let intervals={easy:500, normal:280, hard:120, expert:30};
    let interval=intervals[cpuDifficulty]||200;


    if(this.cpuTimer>=interval){
      this.cpuTimer=0;
      if(cpuDifficulty==='expert'||cpuDifficulty==='hard'){
        this.executeSmartCpu();
      } else {
        let act=Math.random();
        if(act<0.3)this.move(-1,0);
        else if(act<0.6)this.move(1,0);
        else if(act<0.8)this.rotate();
        else if(act<0.95)this.move(0,1);
        else this.drop();
      }
    }
  }


  // 「たつじん」超強AI思考（自滅回避を最高優先に調整）
  executeSmartCpu(){
    let bestScore=-Infinity;
    let bestAction=null;


    let testPieces=[
      {piece:this.piece, isHold:false}
    ];
    if(this.canHold){
      let hPiece = this.holdPiece ? {m:clone(this.holdPiece.m),c:this.holdPiece.c,x:0,y:0} : {m:clone(this.next.m),c:this.next.c,x:0,y:0};
      testPieces.push({piece:hPiece, isHold:true});
    }


    for(let tp of testPieces){
      let curPiece=tp.piece;
      let m=curPiece.m;
      for(let r=0; r<4; r++){
        let rotM=m;
        for(let i=0;i<r;i++){
          rotM=rotM[0].map((_,idx)=>rotM.map(row=>row[idx]).reverse());
        }


        let pW=rotM[0].length;
        for(let x=-2; x<=W-pW+2; x++){
          let tempP={m:rotM, c:curPiece.c, x:x, y:0};
          if(this.hit(tempP,0,0,rotM)) continue;


          let dropY=0;
          while(!this.hit(tempP,0,dropY+1,rotM)){
            dropY++;
          }
          tempP.y=dropY;


          let evalScore = this.evaluateBoardPlacement(tempP);
          if(evalScore > bestScore){
            bestScore = evalScore;
            bestAction = {x:x, rotCount:r, useHold:tp.isHold};
          }
        }
      }
    }


    if(bestAction){
      if(bestAction.useHold){
        this.doHold();
        return;
      }
      for(let i=0; i<bestAction.rotCount; i++) this.rotate();
      if(this.piece.x < bestAction.x) this.move(1,0);
      else if(this.piece.x > bestAction.x) this.move(-1,0);
      else this.drop();
    } else {
      this.drop();
    }
  }


  evaluateBoardPlacement(tempP){
    let simGrid=this.grid.map(r=>r.slice());
    tempP.m.forEach((r,y)=>r.forEach((v,x)=>{
      if(v && tempP.y+y>=0 && tempP.y+y<H && tempP.x+x>=0 && tempP.x+x<W){
        simGrid[tempP.y+y][tempP.x+x]=tempP.c;
      }
    }));


    let clearedLines=0;
    for(let y=0; y<H; y++){
      if(simGrid[y].every(Boolean)) clearedLines++;
    }


    let holes=0;
    let aggregateHeight=0;
    let bumpiness=0;
    let colHeights=Array(W).fill(0);


    for(let x=0; x<W; x++){
      let blockFound=false;
      for(let y=0; y<H; y++){
        if(simGrid[y][x]){
          if(!blockFound){
            colHeights[x]=H-y;
            blockFound=true;
          }
        } else if(blockFound){
          holes++; // ブロック下の空洞（最悪の欠陥）
        }
      }
    }


    let maxHeight = Math.max(...colHeights);
    for(let x=0; x<W; x++){
      aggregateHeight += colHeights[x];
      if(x < W-1){
        bumpiness += Math.abs(colHeights[x] - colHeights[x+1]);
      }
    }


    // 自滅防止アルゴリズム（高さが高くなると自滅回避を爆発的に最優先）
    let dangerHeightPenalty = 0;
    if(maxHeight > 12){
      dangerHeightPenalty = Math.pow(maxHeight - 12, 3) * 1500;
    }


    // 重み付け（たつじん用：完璧な平坦保持＋穴の徹底排除）
    let score = (clearedLines * 300) 
              - (holes * 850) 
              - (aggregateHeight * 12) 
              - (bumpiness * 18) 
              - (maxHeight * 35)
              - dangerHeightPenalty;


    return score;
  }
}


function triggerShake(id, type){
  let box=document.getElementById(`pbox-${id}`);
  if(!box)return;
  box.classList.remove('shake-soft','shake-hard');
  void box.offsetWidth;
  box.classList.add(type==='hard'?'shake-hard':'shake-soft');
}


function sendGarbage(fromId, linesCount){
  players.forEach(p=>{
    if(p.id!==fromId && !p.ended){
      p.addGarbage(linesCount);
    }
  });
}


function tone(freq=440,duration=.07,type='sine',vol=.035){
  if(!sound)return;
  try{
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended')audio.resume();
    let o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    o.connect(g);g.connect(audio.destination);
    o.start();o.stop(audio.currentTime+duration);
  }catch(e){}
}


function buildUI(){
  const container = document.getElementById('boardsContainer');
  container.innerHTML='';
  players=[];
  
  const names=['あなた (P1)', 'CPU 1', 'CPU 2', 'CPU 3'];
  let bWidth=120, bHeight=240, slotSize=36;
  if(numPlayers===1){ bWidth=150; bHeight=300; slotSize=48; }
  else if(numPlayers===2){ bWidth=130; bHeight=260; slotSize=42; }


  for(let i=0; i<numPlayers; i++){
    let p=new TetrisGame(i, i>0, names[i]);
    players.push(p);


    let box=document.createElement('div');
    box.id=`pbox-${i}`;
    box.className=`player-box ${i===0?'self':''}`;
    box.innerHTML=`
      <div class="player-header">
        <span class="p-name">${p.name}</span>
        <span id="p${i}-status" style="font-size:9px;color:#48ff8b;">ALIVE</span>
      </div>
      <div class="player-stats">
        <span>SCORE: <strong id="p${i}-score">0</strong></span>
        <span>LINE: <strong id="p${i}-lines">0</strong></span>
      </div>
      <div class="mini-stage">
        <div class="board-wrap ${i===0?'self-wrap':''}">
          <canvas id="board-${i}" class="board" width="${bWidth}" height="${bHeight}"></canvas>
          ${i===0? '<div id="overlay"><h2>NEON TETRIS</h2><p>設定を選んで<br>スタート！</p><button id="startBtn" class="primary">▶ スタート</button></div>':''}
        </div>
        <div class="mini-side">
          <div class="mini-panel">
            <label>HOLD</label>
            <canvas id="hold-${i}" class="slot-mini" width="${slotSize}" height="${slotSize}"></canvas>
          </div>
          <div class="mini-panel">
            <label>NEXT</label>
            <canvas id="next-${i}" class="slot-mini" width="${slotSize}" height="${slotSize}"></canvas>
          </div>
        </div>
      </div>
    `;
    container.appendChild(box);
  }


  const startBtn = document.getElementById('startBtn');
  if(startBtn){
    startBtn.onclick = (e) => {
      e.preventDefault();
      startGame();
    };
  }


  drawAll();
}


function startGame(){
  cancelAnimationFrame(raf);
  players.forEach(p=>p.init());
  running=true;
  paused=false;
  ended=false;
  last=0;
  
  const overlay=document.getElementById('overlay');
  if(overlay) overlay.style.display='none';
  
  const statusElem = document.getElementById('status');
  if(statusElem) statusElem.textContent='';
  
  const pauseBtn = document.getElementById('pause');
  if(pauseBtn) pauseBtn.textContent='Ⅱ 一時停止';
  
  tone(440,.08);
  raf=requestAnimationFrame(loop);
}


function checkGameOver(){
  let activePlayers=players.filter(p=>!p.ended);
  if(numPlayers===1){
    if(players[0].ended) endGame('GAME OVER');
  } else {
    if(players[0].ended){
      endGame('敗北...');
    } else if(activePlayers.length===1){
      endGame(`🎉 ${activePlayers[0].name} 勝者！`);
    }
  }
}


function endGame(msg){
  running=false;
  ended=true;
  cancelAnimationFrame(raf);


  let overlay=document.getElementById('overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='overlay';
    const firstWrap = document.querySelector('.board-wrap');
    if(firstWrap) firstWrap.appendChild(overlay);
  }
  if(overlay){
    overlay.style.display='flex';
    overlay.innerHTML=`<h2>${msg}</h2><p>スコア: ${players[0].score.toLocaleString()}</p><button id="startBtn" class="primary">↻ もう一度プレイ</button>`;
    const startBtn = document.getElementById('startBtn');
    if(startBtn){
      startBtn.onclick = (e) => {
        e.preventDefault();
        startGame();
      };
    }
  }
  if(sound) tone(180,.4,'sawtooth',.04);
}


function updateUIStats(){
  players.forEach((p,i)=>{
    let scElem=document.getElementById(`p${i}-score`);
    let lnElem=document.getElementById(`p${i}-lines`);
    let stElem=document.getElementById(`p${i}-status`);
    if(scElem)scElem.textContent=p.score.toLocaleString();
    if(lnElem)lnElem.textContent=p.lines;
    if(stElem){
      if(p.ended){
        stElem.textContent='KO';
        stElem.style.color='#ff39dc';
      }
    }
  });
}


function loop(t){
  if(!running)return;
  if(!last)last=t;
  let dt=Math.min(100,t-last);
  last=t;


  if(!paused){
    players.forEach(p=>{
      if(p.ended)return;
      p.updateCpu(dt);
      p.acc+=dt;
      let speed=Math.max(85, 800 - (p.level-1)*65);
      if(p.acc>=speed){
        p.acc=0;
        p.move(0,1);
      }
    });
  }
  drawAll();
  raf=requestAnimationFrame(loop);
}


function drawCell(ctx, c, x, y, S, alpha=1, ghost=false){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=c;
  ctx.shadowColor=c;
  ctx.shadowBlur=ghost?0:10;
  ctx.fillRect(x*S+1, y*S+1, S-2, S-2);
  ctx.shadowBlur=0;
  ctx.fillStyle=ghost?'#ffffff18':'#ffffff60';
  ctx.fillRect(x*S+2, y*S+2, S-4, 2);
  ctx.strokeStyle=ghost?c:'#ffffffd9';
  ctx.lineWidth=ghost?1:1;
  ctx.strokeRect(x*S+1, y*S+1, S-2, S-2);
  ctx.restore();
}


function drawAll(){
  players.forEach(p=>{
    let canvas=document.getElementById(`board-${p.id}`);
    if(!canvas)return;
    let ctx=canvas.getContext('2d');
    let W_px=canvas.width, H_px=canvas.height;
    let S = W_px / W;


    ctx.clearRect(0,0,W_px,H_px);
    ctx.fillStyle='#030612';
    ctx.fillRect(0,0,W_px,H_px);


    ctx.strokeStyle='#14244d';
    ctx.lineWidth=0.5;
    for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,H_px);ctx.stroke();}
    for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(W_px,y*S);ctx.stroke();}


    p.grid.forEach((r,y)=>r.forEach((c,x)=>{if(c)drawCell(ctx,c,x,y,S)}));


    if(p.piece&&!p.ended){
      let gy=p.piece.y;
      while(!p.hit({...p.piece,y:gy},0,1,p.piece.m))gy++;
      p.piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)drawCell(ctx,p.piece.c,p.piece.x+x,gy+y,S,0.22,true)}));
      p.piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)drawCell(ctx,p.piece.c,p.piece.x+x,p.piece.y+y,S)}));
    }


    p.waves=p.waves.filter(w=>w.r<w.maxR);
    for(let w of p.waves){
      ctx.save();
      ctx.beginPath();
      ctx.arc(W_px/2, w.y, w.r, 0, Math.PI*2);
      ctx.strokeStyle=w.color;
      ctx.globalAlpha=Math.max(0, 1 - w.r/w.maxR);
      ctx.lineWidth=3;
      ctx.stroke();
      ctx.restore();
      w.r+=2.5;
    }


    p.particles=p.particles.filter(pt=>pt.life>0);
    for(let pt of p.particles){
      ctx.save();
      ctx.globalAlpha=Math.max(0, pt.life/35);
      ctx.fillStyle=pt.color;
      ctx.shadowColor=pt.color;
      ctx.shadowBlur=8;
      ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
      ctx.restore();
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.06; pt.life--;
    }


    p.floats=p.floats.filter(f=>f.life>0);
    for(let f of p.floats){
      ctx.save();
      ctx.globalAlpha=Math.min(1, f.life/15);
      ctx.fillStyle=f.color;
      ctx.font='bold 12px system-ui';
      ctx.textAlign='center';
      ctx.shadowColor=f.color;
      ctx.shadowBlur=10;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
      f.y-=0.5; f.life--;
    }


    if(p.flash>0){
      ctx.fillStyle=`rgba(90,255,255,${p.flash*0.25})`;
      ctx.fillRect(0,0,W_px,H_px);
      p.flash=Math.max(0,p.flash-0.08);
    }


    drawMiniSlot(`hold-${p.id}`, p.holdPiece);
    drawMiniSlot(`next-${p.id}`, p.next);
  });
}


function drawMiniSlot(id, pieceObj){
  let canvas=document.getElementById(id);
  if(!canvas)return;
  let ctx=canvas.getContext('2d');
  let size=canvas.width;
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle='#030612';
  ctx.fillRect(0,0,size,size);


  if(pieceObj){
    let cellSize=Math.floor(size/5);
    let ox=(size - pieceObj.m[0].length*cellSize)/2;
    let oy=(size - pieceObj.m.length*cellSize)/2;
    pieceObj.m.forEach((r,y)=>r.forEach((v,x)=>{
      if(v){
        ctx.fillStyle=pieceObj.c;
        ctx.shadowColor=pieceObj.c;
        ctx.shadowBlur=6;
        ctx.fillRect(ox+x*cellSize+1, oy+y*cellSize+1, cellSize-2, cellSize-2);
      }
    }));
  }
}


function action(act){
  if(!running||paused||ended||players.length===0)return;
  let p=players[0];
  if(p.ended)return;
  if(act==='left')p.move(-1,0);
  if(act==='right')p.move(1,0);
  if(act==='down')p.move(0,1);
  if(act==='rotate')p.rotate();
  if(act==='drop')p.drop();
  if(act==='hold')p.doHold();
  drawAll();
}


document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.act)));


document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    numPlayers=parseInt(e.target.dataset.players);
    buildUI();
  });
});


document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    cpuDifficulty=e.target.dataset.diff;
  });
});


document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('soundBtn').addEventListener('click',()=>{
  sound=!sound;
  document.getElementById('soundBtn').textContent=sound?'🔊 音ON':'🔇 音OFF';
  if(sound)tone(660,.08);
});
document.getElementById('pause').addEventListener('click',()=>{
  if(!running||ended)return;
  paused=!paused;
  document.getElementById('pause').textContent=paused?'▶ 再開':'Ⅱ 一時停止';
  document.getElementById('status').textContent=paused?'PAUSED':'';
  if(!paused)last=0;
});


document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();
  if(e.key==='Enter'&&(!running||ended)){
    let sb=document.getElementById('startBtn');
    if(sb)sb.click();
    return;
  }
  if(!running||ended)return;
  if(e.key==='ArrowLeft')action('left');
  else if(e.key==='ArrowRight')action('right');
  else if(e.key==='ArrowDown')action('down');
  else if(e.key==='ArrowUp')action('rotate');
  else if(e.code==='Space')action('drop');
  else if(e.key.toLowerCase()==='c'||e.key==='Shift')action('hold');
  else if(e.key.toLowerCase()==='p')document.getElementById('pause').click();
});


buildUI();
})();
</script>

</body>
